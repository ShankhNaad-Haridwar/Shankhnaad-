<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shankh Naad — Haridwar Ka Divine Address</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:#0D0D0D;
  color:#F0E6D3;
  font-family:'Montserrat',sans-serif;
  overflow-x:hidden;
}

/* COLORS - Shankh Naad brand */
:root{
  --gold:#D4A017;
  --gold2:#F5C842;
  --cream:#F0E6D3;
  --saffron:#E8621A;
  --deep:#0D0D0D;
  --card:#1A1A1A;
  --card2:#222222;
  --border:rgba(212,160,23,0.2);
  --muted:#888;
}

/* TOP ALERT BAR */
.alert-bar{
  background:linear-gradient(90deg,#8B0000,#CC0000,#8B0000);
  text-align:center;
  padding:10px 16px;
  font-size:12px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:#fff;
  position:sticky;
  top:0;
  z-index:1000;
}
.alert-bar span{color:#FFD700;}

/* HERO */
.hero{
  position:relative;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  overflow:hidden;
  background:#000;
}
.hero-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0.7;
}
.hero-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,0.3) 0%,
    rgba(0,0,0,0.1) 30%,
    rgba(0,0,0,0.7) 65%,
    rgba(13,13,13,1) 100%
  );
}
.hero-content{
  position:relative;
  z-index:2;
  padding:32px 20px 80px;
}
.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(212,160,23,0.15);
  border:1px solid rgba(212,160,23,0.4);
  border-radius:30px;
  padding:6px 14px;
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--gold2);
  margin-bottom:16px;
}
.hero-h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(36px,9vw,72px);
  font-weight:900;
  line-height:1.05;
  color:#fff;
  margin-bottom:4px;
}
.hero-h1 .gold{color:var(--gold2);}
.hero-hindi{
  font-family:'Noto Sans Devanagari',sans-serif;
  font-size:clamp(16px,4vw,24px);
  color:rgba(245,200,66,0.85);
  font-weight:600;
  margin-bottom:20px;
}
.hero-tagline{
  font-size:14px;
  color:rgba(240,230,211,0.75);
  line-height:1.6;
  max-width:480px;
  margin-bottom:28px;
  font-weight:400;
}
.hero-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1px;
  background:var(--border);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  margin-bottom:28px;
  max-width:500px;
}
.stat{
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  padding:14px 8px;
  text-align:center;
}
.stat-n{
  font-family:'Playfair Display',serif;
  font-size:20px;
  font-weight:700;
  color:var(--gold2);
  display:block;
  line-height:1;
}
.stat-l{
  font-size:9px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.5px;
  margin-top:4px;
  display:block;
}
.btn-hero{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:linear-gradient(135deg,#D4A017,#E8621A);
  color:#fff;
  padding:16px 32px;
  border-radius:6px;
  font-size:15px;
  font-weight:800;
  text-decoration:none;
  text-transform:uppercase;
  letter-spacing:1px;
  border:none;
  cursor:pointer;
}

/* SECTION BASE */
.sec{padding:60px 20px;}
.sec-inner{max-width:680px;margin:0 auto;}
.eyebrow{
  font-size:10px;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:10px;
}
.sec-h2{
  font-family:'Playfair Display',serif;
  font-size:clamp(26px,6vw,44px);
  font-weight:900;
  line-height:1.1;
  color:#fff;
  margin-bottom:12px;
}
.sec-h2 .g{color:var(--gold2);}
.sec-p{
  font-size:14px;
  color:rgba(240,230,211,0.65);
  line-height:1.75;
  margin-bottom:32px;
}
.divider{
  width:48px;height:2px;
  background:linear-gradient(90deg,var(--gold),transparent);
  margin:0 0 28px;
}

/* HOOK SECTION */
.hook-sec{background:#111;}
.hook-grid{display:flex;flex-direction:column;gap:16px;}
.hook-card{
  background:var(--card);
  border-left:3px solid var(--gold);
  border-radius:0 10px 10px 0;
  padding:20px 20px 20px 22px;
}
.hook-num{
  font-size:10px;font-weight:800;
  letter-spacing:2px;color:var(--gold);
  text-transform:uppercase;margin-bottom:6px;
}
.hook-q{
  font-size:15px;font-weight:700;
  color:#fff;margin-bottom:8px;line-height:1.4;
}
.hook-a{
  font-size:13px;color:rgba(240,230,211,0.7);
  line-height:1.65;
}
.hook-a strong{color:var(--gold2);font-weight:700;}

/* VIDEO LIFESTYLE */
.lifestyle-wrap{
  position:relative;
  border-radius:16px;
  overflow:hidden;
  border:1px solid var(--border);
}
.lifestyle-video{
  width:100%;
  height:300px;
  object-fit:cover;
  display:block;
}
.lifestyle-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,0.9) 0%,rgba(0,0,0,0.1) 60%);
  display:flex;
  align-items:flex-end;
  padding:24px 20px;
}
.lifestyle-text .title{
  font-family:'Playfair Display',serif;
  font-size:22px;font-weight:700;
  color:var(--gold2);margin-bottom:4px;
}
.lifestyle-text .sub{
  font-size:12px;color:rgba(240,230,211,0.8);line-height:1.5;
}

/* FEATURE CARDS */
.feature-grid{display:flex;flex-direction:column;gap:0;}
.feat{
  background:var(--card2);
  border-bottom:1px solid rgba(255,255,255,0.05);
  padding:20px;
  display:flex;gap:16px;align-items:flex-start;
}
.feat:last-child{border-bottom:none;border-radius:0 0 12px 12px;}
.feat:first-child{border-radius:12px 12px 0 0;}
.feat-icon{
  width:44px;height:44px;flex-shrink:0;
  background:rgba(212,160,23,0.1);
  border:1px solid var(--border);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
}
.feat-title{font-size:14px;font-weight:700;color:#fff;margin-bottom:4px;}
.feat-desc{font-size:12px;color:var(--muted);line-height:1.6;}
.feat-desc strong{color:var(--gold2);}

/* VALUE STACK */
.vs-sec{background:#0A0A0A;}
.vs-intro{
  background:rgba(212,160,23,0.07);
  border:1px solid var(--border);
  border-radius:10px;padding:20px;
  margin-bottom:24px;
  font-size:14px;color:rgba(240,230,211,0.8);
  line-height:1.7;
}
.vs-intro strong{color:var(--gold2);}
.vs-row{
  display:flex;align-items:flex-start;
  gap:14px;
  padding:16px 0;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.vs-row:last-child{border-bottom:none;}
.vs-check{
  width:28px;height:28px;flex-shrink:0;
  background:rgba(0,200,83,0.1);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;margin-top:2px;
}
.vs-label{font-size:13px;font-weight:600;color:#fff;margin-bottom:2px;}
.vs-note{font-size:11px;color:var(--muted);line-height:1.5;}
.vs-price{
  margin-left:auto;flex-shrink:0;
  font-family:'Playfair Display',serif;
  font-size:14px;font-weight:700;
  color:#00C853;text-align:right;
}
.vs-total{
  background:var(--gold);
  border-radius:10px;
  padding:18px 20px;
  display:flex;align-items:center;
  justify-content:space-between;
  margin-top:20px;
}
.vs-total .tl{
  font-size:13px;font-weight:800;
  color:#000;text-transform:uppercase;letter-spacing:1px;
}
.vs-total .tv{
  font-family:'Playfair Display',serif;
  font-size:22px;font-weight:900;color:#000;
}
.vs-punch{
  text-align:center;margin-top:16px;
  font-size:15px;font-weight:700;color:#fff;
  line-height:1.5;
}
.vs-punch span{color:var(--gold2);}

/* PHOTO GRID */
.photo-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:24px 0;
}
.photo-item{
  position:relative;border-radius:10px;
  overflow:hidden;border:1px solid var(--border);
}
.photo-item img{
  width:100%;height:160px;
  object-fit:cover;display:block;
}
.photo-item video{
  width:100%;height:160px;
  object-fit:cover;display:block;
}
.photo-label{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,0.85));
  padding:20px 10px 10px;
  font-size:11px;font-weight:700;
  color:var(--gold2);text-transform:uppercase;letter-spacing:0.5px;
}

/* CATALYSTS */
.cat-sec{background:#111;}
.cat-item{
  background:var(--card);
  border-radius:12px;
  padding:20px;margin-bottom:12px;
  border:1px solid rgba(255,255,255,0.05);
  display:flex;gap:16px;
}
.cat-item.hot{border-color:rgba(212,160,23,0.3);}
.cat-num{
  font-family:'Playfair Display',serif;
  font-size:32px;font-weight:700;
  color:var(--gold);line-height:1;
  min-width:36px;
}
.cat-title{
  font-size:14px;font-weight:800;
  color:#fff;text-transform:uppercase;
  letter-spacing:0.3px;margin-bottom:6px;
}
.cat-desc{font-size:12px;color:var(--muted);line-height:1.65;}
.cat-desc strong{color:var(--cream);}
.cat-tag{
  display:inline-block;
  background:rgba(212,160,23,0.12);
  color:var(--gold2);
  font-size:9px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;
  padding:3px 8px;border-radius:3px;margin-top:8px;
}

/* OBJECTIONS */
.obj-sec{background:#0A0A0A;}
.obj-item{
  border-bottom:1px solid rgba(255,255,255,0.06);
  padding:20px 0;
}
.obj-item:last-child{border-bottom:none;}
.obj-q{
  font-size:13px;font-weight:800;
  color:#FF4444;
  text-transform:uppercase;letter-spacing:0.3px;
  margin-bottom:10px;display:flex;gap:8px;
  line-height:1.4;
}
.obj-a{
  font-size:13px;color:rgba(240,230,211,0.75);
  line-height:1.7;padding-left:22px;
}
.obj-a strong{color:var(--gold2);}

/* FORM */
.form-sec{background:#0D0D0D;padding:60px 20px 100px;}
.form-wrap{
  max-width:480px;margin:0 auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;padding:32px 20px;
}
.form-eyebrow{
  font-size:10px;font-weight:800;
  letter-spacing:3px;color:#CC0000;
  text-transform:uppercase;margin-bottom:6px;
}
.form-title{
  font-family:'Playfair Display',serif;
  font-size:26px;font-weight:900;color:#fff;
  margin-bottom:6px;line-height:1.1;
}
.form-title .g{color:var(--gold2);}
.form-sub{font-size:12px;color:var(--muted);margin-bottom:24px;line-height:1.5;}
.urgency-box{
  background:rgba(139,0,0,0.15);
  border:1px solid rgba(204,0,0,0.3);
  border-radius:8px;padding:12px 14px;
  margin-bottom:20px;
  font-size:12px;color:rgba(240,230,211,0.85);line-height:1.5;
}
.urgency-box strong{color:#FF6666;}
.fg{margin-bottom:13px;}
.fg label{
  display:block;font-size:10px;font-weight:700;
  color:var(--muted);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:5px;
}
.fg input,.fg select{
  width:100%;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:7px;
  padding:13px 15px;
  color:#fff;font-size:14px;
  font-family:'Montserrat',sans-serif;
  outline:none;-webkit-appearance:none;
  transition:border-color 0.2s;
}
.fg input::placeholder{color:rgba(255,255,255,0.2);}
.fg input:focus,.fg select:focus{border-color:var(--gold);}
.fg select option{background:#1A1A1A;color:#fff;}
.qual-label{
  font-size:10px;font-weight:800;
  color:var(--gold);letter-spacing:2px;
  text-transform:uppercase;
  margin:20px 0 12px;
  padding-top:20px;
  border-top:1px solid var(--border);
}
.btn-main{
  width:100%;
  background:linear-gradient(135deg,#D4A017 0%,#E8621A 100%);
  color:#fff;border:none;border-radius:8px;
  padding:17px;font-size:15px;font-weight:900;
  font-family:'Montserrat',sans-serif;
  text-transform:uppercase;letter-spacing:1.5px;
  cursor:pointer;margin-top:6px;
}
.btn-wa{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;background:#128C7E;
  color:#fff;border:none;border-radius:8px;
  padding:14px;font-size:13px;font-weight:700;
  font-family:'Montserrat',sans-serif;
  cursor:pointer;margin-top:10px;text-decoration:none;
  letter-spacing:0.5px;
}
.trust-row{
  display:flex;gap:12px;justify-content:center;
  margin-top:18px;flex-wrap:wrap;
}
.trust-item{
  font-size:10px;color:var(--muted);
  display:flex;align-items:center;gap:4px;
}

/* BOTTOM STICKY */
.bot-sticky{
  position:fixed;bottom:0;left:0;right:0;z-index:999;
  background:linear-gradient(90deg,#D4A017,#E8621A);
  padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.bot-sticky p{font-size:12px;color:#fff;font-weight:700;line-height:1.3;}
.bot-sticky p span{font-size:11px;font-weight:500;opacity:0.85;display:block;}
.bot-btn{
  background:#000;color:var(--gold2);
  padding:10px 18px;border-radius:5px;
  font-size:12px;font-weight:900;
  text-decoration:none;white-space:nowrap;
  font-family:'Montserrat',sans-serif;
  text-transform:uppercase;letter-spacing:1px;
}

/* ANIMATIONS */
.reveal{opacity:0;transform:translateY(24px);transition:opacity 0.55s ease,transform 0.55s ease;}
.reveal.on{opacity:1;transform:translateY(0);}

@media(min-width:600px){
  .sec{padding:80px 32px;}
  .hero-content{padding:48px 40px 100px;}
  .lifestyle-video{height:380px;}
  .photo-item img,.photo-item video{height:220px;}
}
</style>
</head>
